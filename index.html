<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbfaf7">
  <meta name="description" content="Демонстрационная версия образовательной платформы RKO">
  <title>RKO — Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&amp;family=Urbanist:wght@500;700;800;900&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="splash" id="splash"><span>[ DEMO VERSION ]</span><strong>RKO</strong></div>

  <main class="screen login is-active" id="loginScreen">
    <p class="corner">[ LOGIN / DEMO ]</p>
    <form id="loginForm">
      <h1>ВХОД</h1>
      <input id="login" type="text" placeholder="ЛОГИН" autocomplete="username">
      <label class="password"><input id="password" type="password" placeholder="ПАРОЛЬ" autocomplete="current-password"><button id="eye" type="button" aria-label="Показать пароль">◉</button></label>
      <button class="enter" type="submit">ВОЙТИ</button>
      <p class="success" id="success">УСПЕШНО</p>
      <small>В демоверсии подойдут любые логин и пароль.</small>
    </form>
  </main>

  <section class="screen welcome" id="welcomeScreen"><p>ДОБРО ПОЖАЛОВАТЬ</p><h1>ВЛАД</h1></section>

  <main class="screen dashboard" id="dashboardScreen">
    <header><p class="corner">[ RKO / DEMO ]</p><div>ВЛАД <i></i><button id="admin">АДМИН</button><i></i><button id="logout">ВЫЙТИ</button></div></header>
    <section class="content">
      <h1 id="pageTitle">ОБУЧЕНИЕ</h1>
      <div class="guide"><button id="back">← НАЗАД</button><p id="guide">ВЫБЕРИ РАЗДЕЛ, ЧТОБЫ ПОСМОТРЕТЬ ДЕМОНСТРАЦИЮ.</p></div>
      <div class="list" id="list"></div>
      <article class="article" id="article"><button id="articleBack">← К МАТЕРИАЛАМ</button><p id="articlePath"></p><h2 id="articleTitle"></h2><div id="articleBody"></div></article>
      <p class="signature">[ Влад 2Hard ]</p>
    </section>
  </main>

  <section class="screen no-admin" id="noAdmin"><p>АДМИН-ПАНЕЛЬ</p><h1>НЕ ПОКАЖУ</h1></section>
  <div class="notice" id="notice">ЭТО ДЕМОНСТРАЦИОННЫЙ МАТЕРИАЛ</div>
  <script type="module" src="./app.js"></script>
</body>
</html>
