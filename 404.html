<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbfaf7">
  <title>RKO — страница не найдена</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&amp;family=Urbanist:wght@700;800;900&amp;display=swap" rel="stylesheet">
  <style>
    :root{--milk:#fbfaf7;--graphite:#292929;--grey:#81807f;--red:#ff2400;--amber:#ffae42}
    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{overflow:hidden;background:var(--milk);color:var(--graphite);font-family:Urbanist,Arial,sans-serif;-webkit-font-smoothing:antialiased}
    .corner{position:fixed;top:34px;left:4vw;margin:0;color:var(--grey);font:500 .82rem "DM Mono",monospace;letter-spacing:.08em}
    main{display:grid;height:100%;place-content:center;text-align:center;padding:24px}
    small{margin:0 0 8px;color:var(--grey);font:500 .82rem "DM Mono",monospace;letter-spacing:.12em}
    h1{margin:0;font-size:clamp(7rem,22vw,18rem);line-height:.75;letter-spacing:-.08em}
    p{margin:42px 0 28px;color:var(--grey);font-weight:800}
    a{justify-self:center;color:var(--red);font-weight:900;text-decoration:none;transition:.35s ease;transform-origin:center}
    a:hover,a:focus-visible{color:var(--amber);outline:0}
    a:active{transform:scale(1.15)}
    @media(max-width:600px){.corner{top:24px;left:20px}p{max-width:280px;line-height:1.45}}
  </style>
</head>
<body>
  <p class="corner">[ RKO / ОШИБКА ]</p>
  <main>
    <small>СТРАНИЦА НЕ НАЙДЕНА</small>
    <h1>404</h1>
    <p>ВОЗМОЖНО, МАТЕРИАЛ ПЕРЕМЕСТИЛИ ИЛИ ССЫЛКА УСТАРЕЛА.</p>
    <a href="/rko-demo/">← ВЕРНУТЬСЯ В ДЕМО</a>
  </main>
</body>
</html>
